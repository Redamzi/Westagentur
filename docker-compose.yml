version: '3.8'

services:
  westagentur:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    container_name: westagentur-app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    environment:
      - NODE_ENV=production
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - MAIL_FROM=${MAIL_FROM:-Westagentur <mail@westagentur.de>}
      - MAIL_TO=${MAIL_TO:-mail@westagentur.de}
      - PUBLIC_URL=${PUBLIC_URL:-https://westagentur.de}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - SECURE_COOKIES=${SECURE_COOKIES:-true}
      - VAPI_WEBHOOK_SECRET=${VAPI_WEBHOOK_SECRET:-}
      - GOOGLE_REVIEW_URL=${GOOGLE_REVIEW_URL:-}
    volumes:
      - westagentur-data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  westagentur-data:
