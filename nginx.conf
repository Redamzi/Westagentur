# Access log without full IP addresses (last IPv4 block / IPv6 after 3 groups removed)
map $remote_addr $remote_addr_anon {
    ~^(?P<a>\d+\.\d+\.\d+)\.\d+$          $a.0;
    ~^(?P<a>[0-9a-fA-F]*:[0-9a-fA-F]*:[0-9a-fA-F]*):  $a::;
    default                                     0.0.0.0;
}
log_format anonymized '$remote_addr_anon - [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {
    listen 80;
    access_log /var/log/nginx/access.log anonymized;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    # Real client IP behind the hosting reverse proxy (Coolify/Traefik)
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/xml text/plain;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Node API (server/)
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 32k;
    }

    # Hashed build assets can be cached forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Prerendered pages: /webdesign -> /webdesign/index.html
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
